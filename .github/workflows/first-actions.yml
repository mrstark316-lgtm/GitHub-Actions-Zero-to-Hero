name: My First GitHub Actions

on:
  push:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pytest

      - name: Run Tests
        run: |
          cd src
          pytest addition.py
